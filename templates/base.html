<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafePay Shield — {% block title %}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 4 7v8c0 7.2 5.1 13.4 12 15 6.9-1.6 12-7.8 12-15V7z' fill='%23245bdb'/%3E%3Cpath d='m11 16 3.5 3.5L21 13' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body data-page="{{ page }}">
  <header class="topbar">
    <a class="brand" href="/">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 4 7v8c0 7.2 5.1 13.4 12 15 6.9-1.6 12-7.8 12-15V7z"/><path class="tick" d="m11 16 3.5 3.5L21 13"/></svg>
      <span><strong data-i18n="app.name">SafePay Shield</strong><small data-i18n="app.tagline">Stops payments made under pressure</small></span>
    </a>
    <nav class="tabs" aria-label="Main">
      <a href="/" data-nav="pay" data-i18n="nav.pay">Pay</a>
      <a href="/dashboard" data-nav="dashboard" data-i18n="nav.dashboard">Dashboard</a>
      <a href="/evaluation" data-nav="evaluation" data-i18n="nav.evaluation">Evaluation</a>
      <a href="/settings" data-nav="settings" data-i18n="nav.settings">Settings</a>
    </nav>
    <div class="topbar-controls">
      <label class="field-inline">
        <span class="sr-only" data-i18n="nav.user">Payer</span>
        <select id="userPicker" aria-label="Payer"></select>
      </label>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="hi">हिं</button>
        <button type="button" data-lang="mr">मरा</button>
      </div>
    </div>
  </header>
  <div class="sim-ribbon" role="note"><span class="dot"></span><span data-i18n="app.simulated">Simulated — no real money moved</span></div>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
